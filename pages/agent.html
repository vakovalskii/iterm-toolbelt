<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent actions</title>
<style>
:root{--bg:#14161a;--fg:#d8dce3;--mut:#7d8590;--line:#2a2f37;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.45 -apple-system,BlinkMacSystemFont,"SF Mono",Menlo,monospace}
.s{padding:8px 10px;border-bottom:1px solid var(--line)}h3{margin:0 0 4px;font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chip{cursor:pointer;padding:0 7px;border:1px solid var(--line);border-radius:9px;color:var(--mut)}.chip.on{color:var(--fg);border-color:var(--acc)}
.it{display:flex;gap:6px;align-items:baseline;padding:2px 10px;cursor:pointer;white-space:nowrap;overflow:hidden}.it:hover{background:#1c2128}.it.sel{background:#1f2a3a}
.it .t{color:var(--mut);flex:none;width:64px}.it .k{flex:none;width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it .l{overflow:hidden;text-overflow:ellipsis;font-family:"SF Mono",Menlo,monospace}
.bash{color:#e3b341}.edit{color:#56d364}.read{color:#79c0ff}.search{color:#d2a8ff}.agent{color:#ff7b72}.web{color:#39c5cf}.mcp{color:#a5d6ff}.other{color:var(--mut)}
pre{margin:4px 10px 8px;font:11px/1.35 "SF Mono",Menlo,monospace;white-space:pre-wrap;word-break:break-all;max-height:50vh;overflow:auto;background:#0e1013;padding:6px;border-radius:4px}
.add{color:var(--ok)}.del{color:var(--bad)}.hunk{color:var(--acc)}
#top{position:sticky;top:0;background:var(--bg);z-index:2}#net{max-height:45vh;overflow:auto}#end{position:fixed;right:10px;bottom:10px;width:28px;height:28px;border-radius:14px;background:#1f2a3a;color:var(--acc);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--line)}
#net summary{cursor:pointer;color:var(--mut);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;list-style:none}#net summary::-webkit-details-marker{display:none}
#net table{border-collapse:collapse;width:100%;margin-top:4px}#net td{padding:1px 6px 1px 0;white-space:nowrap}#net td.n{max-width:130px;overflow:hidden;text-overflow:ellipsis}#net .warn{color:var(--warn)}#net .cur{color:var(--acc)}#net .lnk{cursor:pointer;color:var(--acc);font-size:11px}#net .lnk:hover{text-decoration:underline}#net td.act{text-align:right}
</style></head><body><div id="top"><details id="net" class="s"><summary>network</summary><div id="netb" class="mut">probing…</div></details><div id="hdr" class="s mut">loading…</div></div><div id="list"></div><div id="end" title="jump to latest" onclick="follow=true;sel=null;lastKey=null;tick();toEnd()">⬇</div>
<script>
const K={all:"all",bash:"bash",edit:"edits",read:"reads",search:"search",agent:"agents",web:"web",mcp:"mcp"};
let flt="all", sel=null, lastKey=null, follow=true, first=true, lastSid=null;
try{flt=localStorage.getItem("flt")||"all"}catch(_){}
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tm=iso=>{const d=new Date(iso);if(isNaN(d))return "";const n=new Date();const hm=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",second:"2-digit"});return d.toDateString()===n.toDateString()?hm:d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})+" "+hm.slice(0,5)};
const col=t=>t.split("\n").map(l=>`<span class="${l.startsWith("+")?"add":l.startsWith("-")?"del":l.startsWith("@@")||l.startsWith("#")?"hunk":""}">${e(l)}</span>`).join("\n");
window.addEventListener("scroll",()=>{follow=(window.innerHeight+window.scrollY)>=document.body.scrollHeight-60});
const toEnd=()=>requestAnimationFrame(()=>window.scrollTo(0,document.documentElement.scrollHeight));
async function detail(i){const t=await (await fetch("/agent/item?i="+i)).text();const b=document.getElementById("d"+i);if(b)b.innerHTML=`<pre>${col(t)}</pre>`}
function render(d){
  const c=d.claude;
  let h=`<h3>${e(d.session)}</h3>`;
  if(!c){h+=`<div class="mut">no claude running in this pane</div>`;document.getElementById("hdr").innerHTML=h;document.getElementById("list").innerHTML="";return}
  if(c.sid!==lastSid){lastSid=c.sid;first=true;sel=null}
  const counts={};d.items.forEach(x=>counts[x.kind]=(counts[x.kind]||0)+1);
  h+=`<div>${e(c.name||"")} <span class="mut">· ${e(c.status||"")} · pid ${e(c.pid)} · actions ${d.total}</span></div><div class="chips">`;
  for(const k in K){if(k!=="all"&&!counts[k])continue;h+=`<span class="chip ${flt===k?"on":""}" data-k="${k}">${K[k]}${k==="all"?"":" "+counts[k]}</span>`}
  h+=`</div>`;document.getElementById("hdr").innerHTML=h;
  document.querySelectorAll(".chip").forEach(n=>n.onclick=()=>{flt=n.dataset.k;try{localStorage.setItem("flt",flt)}catch(_){};first=true;lastKey=null;tick()});
  let L="";for(const x of d.items){if(flt!=="all"&&x.kind!==flt)continue;
    L+=`<div class="it ${sel===x.i?"sel":""}" data-i="${x.i}"><span class="t">${e(tm(x.t))}</span><span class="k ${x.kind}">${e(x.kind==="mcp"?x.tool.replace(/^mcp__/,"").replace(/^(plugin|claude_ai)_/,"").split("__")[0].split("_")[0].slice(0,9):x.kind==="other"?x.tool.slice(0,9):K[x.kind])}</span><span class="l ${x.res==="err"?"bad":""}">${x.res==="err"?"✗ ":x.res===null?"… ":""}${e(x.line)}</span></div>${sel===x.i?`<div id="d${x.i}"></div>`:""}`}
  document.getElementById("list").innerHTML=L||`<div class="s mut">empty</div>`;
  document.querySelectorAll(".it").forEach(n=>n.onclick=()=>{const i=+n.dataset.i;sel=sel===i?null:i;follow=false;lastKey=null;tick()});
  if(sel!==null)detail(sel);
  if(follow||first){first=false;toEnd()}
}
let V=null;
async function tick(){try{const d=await (await fetch("/agent/state")).json();if(V&&d.v!==V){location.reload();return}V=d.v;const key=JSON.stringify([d.claude&&d.claude.sid,d.claude&&d.claude.status,d.total,d.items.length&&d.items[d.items.length-1].res,flt,sel]);if(key!==lastKey){lastKey=key;render(d)}}catch(_){document.getElementById("hdr").innerHTML='<span class="bad">panel is not responding</span>'}}
tick();setInterval(tick,1000);
// ── network: the proxy this claude runs through, proxy liveness, foreign servers
const nd=document.getElementById("net");try{nd.open=localStorage.getItem("net")!=="0"}catch(_){nd.open=true}
nd.addEventListener("toggle",()=>{try{localStorage.setItem("net",nd.open?"1":"0")}catch(_){}});
const api=r=>!r||!r.code?`<span class="bad">dead</span>`:r.code===403?`<span class="warn">403 ${r.ms}ms</span>`:r.code<500?`<span class="ok">${r.ms}ms</span>`:`<span class="warn">${r.code}</span>`;
const alive=p=>p&&p.anthropic&&p.openai&&p.anthropic.code&&p.anthropic.code!==403&&p.anthropic.code<500&&p.openai.code&&p.openai.code<500;
async function net(){try{const d=await (await fetch("/net/state")).json();const pr=d.probe;
  const cur=d.session;let h="",sum="network";
  if(cur){const row=pr&&pr.proxies.find(x=>x.name===cur.name);const ok=row?alive(row):null;
    sum=`network · claude via <span class="${ok===false?"bad":ok?"ok":"cur"}">${e(cur.name)}</span>`;
    h+=`<div>this claude → <b class="cur">${e(cur.name)}</b> ${cur.url?`<span class="mut">${e(cur.url)}</span>`:""} ${ok===false?'<span class="bad">✗ proxy is down</span>':ok?'<span class="ok">✓ alive</span>':""}</div>`}
  if(!pr){h+=`<div class="mut">probing…</div>`}else{
    h+=`<table><tr class="mut"><td>proxy</td><td>anthropic</td><td>openai</td><td></td></tr>`;
    for(const p of pr.proxies)h+=`<tr><td class="n ${cur&&cur.name===p.name?"cur":""}" title="${e(p.hp)}">${alive(p)?"●":"○"} ${e(p.name)}</td><td>${api(p.anthropic)}</td><td>${api(p.openai)}</td><td class="act"><span class="lnk" data-copy="${e(p.name)}" title="copy an export line for a shell">⧉ export</span> <span class="lnk" data-run="${e(p.name)}" title="new claude in this directory through this proxy (new tab)">▶ claude</span></td></tr>`;
    h+=`</table>`;
    const kn=d.keenetic;
    if(kn&&kn.error){h+=`<div class="mut">router: ${e(kn.error)}</div>`}
    else if(kn&&kn.tunnels){const ago=x=>x===null?"—":x<120?x+"s":Math.round(x/60)+"m";const mb=b=>b==null?"":(b/1048576).toFixed(b>1048576*10?0:1)+"M";
      h+=`<table><tr class="mut"><td>tunnel</td><td>check</td><td>handshake</td><td>rx/tx</td></tr>`;
      for(const t of kn.tunnels){const st=!t.up||t.check==="fail"?"bad":t.check==="pass"?"ok":"warn";
        h+=`<tr><td class="n" title="${e(t.iface)}"><span class="${st}">●</span> ${e(t.desc||t.iface)}</td><td class="${st}">${t.up?e(t.check||"on"):"down"}</td><td>${ago(t.handshake)}</td><td class="mut">${mb(t.rx)}/${mb(t.tx)}</td></tr>`}
      h+=`</table><table>`;const dn=Object.fromEntries(kn.tunnels.map(t=>[t.iface,t.desc||t.iface]));
      for(const g of kn.groups)h+=`<tr><td class="n">${e(g.name.replace(/^vpn-/,""))}</td><td>${g.active?`<span class="ok">→ ${e(dn[g.active])}</span>`:'<span class="bad">no live tunnel</span>'} <span class="mut">${e(g.chain.map(i=>(dn[i]||i).replace(/^(NL|US)-/,"")).join(" › "))}</span></td></tr>`;
      h+=`</table>`}
    if(pr.servers.length){h+=`<table><tr class="mut"><td>server</td><td>ping</td><td>port</td></tr>`;
      for(const s of pr.servers){const st=(s.banner||(s.nobanner&&s.tcp!==null))?"ok":s.tcp!==null?"warn":"bad";
        h+=`<tr><td class="n" title="${e(s.host)}:${s.port}"><span class="${st}">●</span> ${e(s.name)}</td><td>${s.ping!==null?s.ping+"ms":'<span class="mut">—</span>'}</td><td class="${st}">${(s.banner||s.nobanner)&&s.tcp!==null?s.tcp+"ms":s.tcp!==null?"open, no banner":"closed"}</td></tr>`}
      h+=`</table>`}
    h+=`<div class="mut">checked ${new Date(pr.at*1000).toLocaleTimeString("ru-RU")}, from this Mac</div>`}
  nd.querySelector("summary").innerHTML=sum;document.getElementById("netb").innerHTML=h}catch(_){}}
net();setInterval(net,5000);
// proxy actions: the export line (with the password) is put on the clipboard by the service, not shown here
document.getElementById("netb").addEventListener("click",async ev=>{const t=ev.target.closest(".lnk");if(!t)return;
  const copy=t.dataset.copy,run=t.dataset.run,old=t.textContent;t.textContent="…";
  try{const r=await (await fetch((copy?"/net/copy?":"/sessions/open?")+new URLSearchParams(copy?{name:copy}:{tool:"claude",proxy:run}),
      {method:"POST",headers:{"X-Toolbelt":"1"}})).text();
    t.textContent=r==="copied"?"✓ copied":r==="ok"?"✓ opened":"✗ "+r}catch(_){t.textContent="✗ error"}
  setTimeout(()=>{t.textContent=old},1800)});
</script></body></html>
