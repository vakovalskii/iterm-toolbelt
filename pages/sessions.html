<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Sessions</title>
<style>
:root{--bg:#14161a;--card:#1a1e24;--fg:#d8dce3;--mut:#7d8590;--line:#2a2f37;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--acc:#58a6ff;--cl:#d97757;--cx:#3fb950;--pi:#bda5ff;--omp:#72c6d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.45 -apple-system,BlinkMacSystemFont,"SF Mono",Menlo,monospace;overflow-x:hidden}
#top{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 10px}
.nav{display:flex;gap:6px;align-items:center}.nav b{font-size:13px}.back{cursor:pointer;color:var(--acc);font-size:15px;padding:0 4px}.sp{flex:1}
.tabs{display:flex;gap:4px}.tab{cursor:pointer;padding:1px 8px;border-radius:9px;border:1px solid var(--line);color:var(--mut)}.tab.on{color:var(--fg);border-color:var(--acc)}
.opts{display:flex;gap:6px;align-items:center;margin-top:5px;color:var(--mut);flex-wrap:wrap}.opt{cursor:pointer;padding:0 6px;border-radius:9px;border:1px solid var(--line)}.opt.on{color:var(--fg);border-color:var(--acc)}
input[type=search]{width:100%;margin-top:6px;background:#0e1013;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font:inherit}
.scr{padding:10px}.scr.fwd-anim{animation:fwd .2s ease-out}.scr.back-anim{animation:bwd .2s ease-out}
@keyframes fwd{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}@keyframes bwd{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.big{display:grid;gap:10px}.agent{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;transition:transform .12s,border-color .12s}.agent:hover{transform:translateY(-2px);border-color:var(--acc)}
.agent h2{margin:0 0 4px;font-size:16px}.agent.claude h2{color:var(--cl)}.agent.codex h2{color:var(--cx)}.agent.pi h2{color:var(--pi)}.agent.omp h2{color:var(--omp)}.agent.act h2{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:2px;transition:transform .12s,border-color .12s;min-width:0}.tile:hover{transform:translateY(-2px);border-color:var(--acc)}
.tile.here{border-color:var(--warn)}.tile .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile .p{color:var(--mut);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{color:var(--mut)}.live{color:var(--ok)}.warn{color:var(--warn)}
.r{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-bottom:6px}
.r.cur{border-color:var(--ok);border-left:4px solid var(--ok);background:#15241b;box-shadow:0 0 0 1px var(--ok) inset,0 0 12px rgba(63,185,80,.25)}
.here-b{display:inline-flex;align-items:center;gap:5px;color:#0d1117;background:var(--ok);font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:9px;text-transform:uppercase}
.here-b i{width:6px;height:6px;border-radius:3px;background:#0d1117;animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.rt{display:flex;gap:6px;align-items:baseline;white-space:nowrap}.ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0}
button{background:#1f2a3a;color:var(--acc);border:1px solid var(--line);border-radius:5px;padding:2px 9px;cursor:pointer;font:inherit;flex:none}button:hover{border-color:var(--acc)}button.new{color:var(--ok)}
.claude-t{color:var(--cl)}.codex-t{color:var(--cx)}.pi-t{color:var(--pi)}.omp-t{color:var(--omp)}
.win{margin-top:6px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#0e1013}
.win .bar{display:flex;gap:2px;padding:4px 4px 0;background:#181c22;overflow-x:auto}.win .bar span{padding:2px 7px;border-radius:5px 5px 0 0;background:#232831;color:var(--mut);white-space:nowrap;font-size:10px;cursor:pointer}.win .bar span.on{background:#0e1013;color:var(--fg)}
.win .body{display:flex;gap:3px;padding:4px;min-height:44px}.win .body.h{flex-direction:column}
.pane{flex:1;min-width:0;border:1px solid #2a2f37;border-radius:4px;padding:4px 5px;display:flex;flex-direction:column;gap:1px}
.pane .d{font-weight:600;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pane .a{font-size:10px}.pane .t{font-size:10px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pane.claude{border-color:#5a3a2c}.pane.codex{border-color:#24502d}.pane.pi{border-color:#51436d}.pane.omp{border-color:#2d5660}
#toast{position:fixed;left:10px;right:10px;bottom:10px;background:#1f2a3a;border:1px solid var(--acc);border-radius:6px;padding:6px 8px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.on{opacity:1}
</style></head><body>
<div id="top"></div><div id="main"></div><div id="toast"></div>
<script>
let D=null, V=null, nav=[{s:"start"}], q="", skip=true, where="window", lastKey=null, dir="fwd";
let localPref=false;try{localPref=localStorage.getItem("skip")!==null;skip=localStorage.getItem("skip")!=="0";where=localStorage.getItem("where")||"";const n=JSON.parse(localStorage.getItem("nav")||"null");if(Array.isArray(n)&&n.length)nav=n}catch(_){}
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=ms=>{if(!ms)return "";const s=(Date.now()-ms)/1000;if(s<90)return "now";if(s<3600)return Math.round(s/60)+"m";if(s<86400)return Math.round(s/3600)+"h";return Math.round(s/86400)+"d"};
const base=p=>(p||"").split("/").filter(Boolean).pop()||p||"?";
const short=p=>(p||"").replace(/^\/Users\/[^/]+/,"~");
const AGENTS={claude:"Claude Code",codex:"Codex",pi:"pi",omp:"omp"};
const cur=()=>nav[nav.length-1];
function go(st){dir="fwd";nav.push(st);save();lastKey=null;draw()}
function back(){if(nav.length>1){dir="bwd";nav.pop();save();lastKey=null;draw()}}
function home(s){dir="fwd";nav=[{s}];save();lastKey=null;draw()}
function save(){try{localStorage.setItem("nav",JSON.stringify(nav))}catch(_){}}
function toast(t){const n=document.getElementById("toast");n.textContent=t;n.classList.add("on");setTimeout(()=>n.classList.remove("on"),2200)}
async function post(path,params){const r=await fetch(path+"?"+new URLSearchParams(params),{method:"POST",headers:{"X-Toolbelt":"1"}});return r.text()}
async function launch(tool,id,dirp,btn){if(btn){btn.disabled=true;btn.textContent="…"}
  const t=await post("/sessions/open",{tool,id:id||"",dir:dirp||"",skip:skip?"1":"0",where});
  toast(t==="ok"?(id?"session opened":"new session started"):t);if(btn){btn.disabled=false;btn.textContent=id?"Resume":"＋ new"}}
async function focusTty(tty){const t=await post("/sessions/focus",{tty});toast(t==="ok"?"switched":t)}
function projects(tool){const m={};for(const r of D.rows){if(r.tool!==tool||!r.dir)continue;const p=m[r.dir]||(m[r.dir]={dir:r.dir,n:0,last:0,live:0});p.n++;p.last=Math.max(p.last,r.last);if(r.live)p.live++}
  return Object.values(m).sort((a,b)=>(b.dir===D.cwd)-(a.dir===D.cwd)||b.last-a.last)}
function topbar(){const c=cur();const act=D.active.length;
  let h=`<div class="nav">${nav.length>1?'<span class="back" title="back">←</span>':""}<b>${e(c.s==="start"?"Sessions":c.s==="active"?"Running":c.s==="snaps"?"Window snapshots":c.s==="projects"?AGENTS[c.tool]:base(c.dir))}</b><span class="sp"></span>
  <div class="tabs"><span class="tab ${c.s!=="active"&&c.s!=="snaps"?"on":""}" data-h="start">agents</span><span class="tab ${c.s==="active"?"on":""}" data-h="active">running ${act}</span><span class="tab ${c.s==="snaps"?"on":""}" data-h="snaps">snapshots</span></div></div>
  <div class="opts">open in: <span class="opt ${where==="window"?"on":""}" data-w="window">window</span><span class="opt ${where==="tab"?"on":""}" data-w="tab">tab</span><span class="sp"></span><label><input type="checkbox" id="skip" ${skip?"checked":""}> Claude skip-permissions</label><a href="/settings#agents" title="agent proxy and flags" style="color:var(--acc);text-decoration:none">⚙ proxy</a></div>`;
  if(c.s==="projects"||c.s==="project")h+=`<input id="q" type="search" placeholder="${c.s==="projects"?"project or session text…":"search this project's sessions…"}" value="${e(q)}">`;
  const T=document.getElementById("top");if(T.dataset.h===h)return;T.dataset.h=h;T.innerHTML=h;
  T.querySelector(".back")?.addEventListener("click",back);
  T.querySelectorAll("[data-h]").forEach(n=>n.onclick=()=>{q="";home(n.dataset.h);if(n.dataset.h==="snaps")loadSnaps(true)});
  T.querySelectorAll("[data-w]").forEach(n=>n.onclick=()=>{where=n.dataset.w;try{localStorage.setItem("where",where)}catch(_){};topbar()});
  T.querySelector("#skip").onchange=ev=>{skip=ev.target.checked;localPref=true;try{localStorage.setItem("skip",skip?"1":"0")}catch(_){}};
  const qi=T.querySelector("#q");if(qi){qi.oninput=ev=>{q=ev.target.value;body()};}
}
function body(){const c=cur();let h="";
  if(c.s==="start"){
    const st=t=>{const r=D.rows.filter(x=>x.tool===t);return{n:r.length,p:new Set(r.map(x=>x.dir)).size,last:r[0]?.last||0,live:r.filter(x=>x.live).length}};
    h=`<div class="big">${Object.entries(AGENTS).map(([tool,name])=>{const x=st(tool);return `<div class="agent ${tool}" data-a="${tool}"><h2>${name}</h2><div>${x.n} sessions · ${x.p} projects</div><div class="mut">${x.last?`last ${ago(x.last)}`:"no sessions yet"} ${x.live?`· <span class="live">● ${x.live} running</span>`:""}</div></div>`}).join("")}
    <div class="agent act" data-act="1"><h2>Running now</h2><div>${D.active.length} running</div><div class="mut">jump to the window where the agent runs</div></div></div>
    <div class="mut" style="margin-top:10px">pane: ${e(D.session||"?")} · ${e(short(D.cwd))}</div>`;
  }else if(c.s==="projects"){
    const ql=q.toLowerCase().trim();let ps=projects(c.tool);
    if(ql)ps=ps.filter(p=>p.dir.toLowerCase().includes(ql)||D.rows.some(r=>r.dir===p.dir&&r.tool===c.tool&&r.title.toLowerCase().includes(ql)));
    h=`<div class="grid">${ps.map(p=>`<div class="tile ${p.dir===D.cwd?"here":""}" data-d="${e(p.dir)}"><span class="n">${e(base(p.dir))}</span><span class="p">${e(short(p.dir))}</span><span class="mut">${p.n} sess. · ${ago(p.last)} ${p.live?`<span class="live">● ${p.live}</span>`:""}${p.dir===D.cwd?' <span class="warn">here</span>':""}</span><span><button class="new" data-new="${e(p.dir)}">＋ new</button></span></div>`).join("")}</div>`||`<div class="mut">nothing</div>`;
  }else if(c.s==="project"){
    const ql=q.toLowerCase().trim();let rs=D.rows.filter(r=>r.tool===c.tool&&r.dir===c.dir);
    if(ql)rs=rs.filter(r=>(r.title+" "+r.id).toLowerCase().includes(ql));
    h=`<div style="margin-bottom:8px;display:flex;gap:6px;align-items:center"><span class="mut">${e(short(c.dir))}</span><span class="sp"></span><button class="new" data-new="${e(c.dir)}">＋ new ${e(AGENTS[c.tool]||c.tool)}</button></div>`;
    h+=rs.slice(0,300).map(r=>`<div class="r"><div class="rt"><span class="mut">${ago(r.last)}</span>${r.live?'<span class="live">● running</span>':""}<span class="sp"></span><button data-id="${e(r.id)}" data-live="${r.live?1:0}">Resume</button></div><div class="ttl">${e(r.title)||'<span class="mut">(no text)</span>'}</div><div class="mut">${e(r.id.slice(0,8))}</div></div>`).join("")||`<div class="mut">no sessions</div>`;
  }else if(c.s==="snaps"){
    const S=SN||[];const la=S.find(x=>x.name.startsWith("auto-"));const lastAuto=la?la.mtime:0;
    h=`<div class="r"><div class="rt"><b>Save windows</b></div><div class="rt" style="margin-top:5px"><input id="snapname" type="text" value="${e(SNAPNAME||snapDefault())}" style="flex:1;min-width:0;background:#0e1013;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font:inherit"><button class="new" data-scope="window">💾 this window</button><button class="new" data-scope="all">💾 all windows</button></div><label class="row" style="margin:4px 0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="autosave" ${SNA?"checked":""}> autosave all windows every 5 minutes${lastAuto?` <span class="mut">· last ${ago(lastAuto)} ago</span>`:""}</label><div class="mut">"this window" is the focused one. A snapshot keeps tabs, splits, tab names, directories and agent sessions. Autosave runs every 5 minutes if something changed</div></div>`;
    h+=S.map(x=>`<div class="r"><div class="rt"><b>${e(x.name)}</b>${x.auto?'<span class="mut">auto</span>':""}<span class="mut">${ago(x.mtime)}</span><span class="sp"></span><button data-snap="${e(x.name)}">Restore</button></div><div class="mut">tabs ${x.tabs.length} · panes ${x.tabs.reduce((a,t)=>a+t.panes,0)} · agents ${x.tabs.reduce((a,t)=>a+t.agents,0)}</div>${winViz(x)}</div>`).join("")||`<div class="mut">no snapshots</div>`;
  }else if(c.s==="active"){
    const t={};D.rows.forEach(r=>t[r.id]=r.title);
    const here=a=>D.tty&&a.tty===D.tty;h=[...D.active].sort((x,y)=>here(y)-here(x)).map(a=>`<div class="r ${here(a)?"cur":""}"><div class="rt"><span class="${a.tool}-t">${a.tool}</span><b>${e(base(a.dir))}</b><span class="mut">${e(a.status||"")}</span>${here(a)?'<span class="here-b"><i></i>active</span>':""}<span class="sp"></span>${a.tty&&a.tty!=="??"?`<button data-tty="${e(a.tty)}">Go to</button>`:'<span class="mut">not in a terminal</span>'}</div><div class="ttl">${e(t[a.id]||a.name||"")}</div><div class="mut">${e(short(a.dir))} · pid ${a.pid}${a.since?" · for "+ago(a.since):""}</div></div>`).join("")||`<div class="mut">no agents running</div>`;
  }
  const M=document.getElementById("main");
  if(dir==="none"&&M.dataset.h===h)return;   // nothing visible changed: leave the DOM alone
  const y=window.scrollY;
  M.dataset.h=h;
  M.innerHTML=`<div class="scr ${dir==="bwd"?"back-anim":dir==="fwd"?"fwd-anim":""}">${h}</div>`;
  if(dir==="none")window.scrollTo(0,y);
  dir="none";
  M.querySelectorAll("[data-a]").forEach(n=>n.onclick=()=>{q="";go({s:"projects",tool:n.dataset.a})});
  M.querySelectorAll("[data-act]").forEach(n=>n.onclick=()=>home("active"));
  M.querySelectorAll(".tile").forEach(n=>n.onclick=ev=>{if(ev.target.closest("button"))return;q="";go({s:"project",tool:cur().tool,dir:n.dataset.d})});
  M.querySelectorAll("[data-new]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();launch(cur().tool,"",b.dataset.new,b)});
  M.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{if(b.dataset.live==="1"&&!armed(b,"running, click again = copy"))return;launch(cur().tool,b.dataset.id,cur().dir,b)});
  M.querySelectorAll("[data-tty]").forEach(b=>b.onclick=()=>focusTty(b.dataset.tty));
  M.querySelector("#autosave")?.addEventListener("change",async ev=>{const on=ev.target.checked;const r=await (await fetch("/settings/save",{method:"POST",headers:{"X-Toolbelt":"1","Content-Type":"application/json"},body:JSON.stringify({autosave:on})})).text();toast(r==="ok"?(on?"autosave on":"autosave off"):r);loadSnaps(true)});
  M.querySelectorAll("[data-sn]").forEach(n=>n.onclick=()=>{SNTAB[n.dataset.sn]=+n.dataset.ti;body()});
  M.querySelector("#snapname")?.addEventListener("input",ev=>{SNAPNAME=ev.target.value});
  M.querySelectorAll("[data-scope]").forEach(btn=>btn.addEventListener("click",async ev=>{const b=ev.currentTarget;const scope=b.dataset.scope;const n=(M.querySelector("#snapname")?.value||"").trim()||snapDefault();b.disabled=true;const t=await post("/snaps/save",{name:n,scope});b.disabled=false;if(t==="ok")SNAPNAME="";toast(t==="ok"?"saved: "+n:t);loadSnaps(true)}));
  M.querySelectorAll("[data-snap]").forEach(b=>b.onclick=async()=>{if(!armed(b,"sure? click again"))return;b.disabled=true;b.textContent="…";const t=await post("/snaps/restore",{name:b.dataset.snap,skip:skip?"1":"0"});b.disabled=false;b.textContent="Restore";toast(t==="ok"?"window restored":t)});
}
// iTerm's built-in browser never shows prompt()/confirm(): confirm with a second click
function armed(b,label){if(b.dataset.armed==="1"){b.dataset.armed="";return true}
  const old=b.textContent;b.dataset.armed="1";b.textContent=label;b.style.color="var(--warn)";
  setTimeout(()=>{if(b.dataset.armed==="1"){b.dataset.armed="";b.textContent=old;b.style.color=""}},3000);return false}
function snapDefault(){const d=new Date(),z=x=>String(x).padStart(2,"0");return `snap ${z(d.getDate())}.${z(d.getMonth()+1)} ${z(d.getHours())}.${z(d.getMinutes())}`}
let SN=null, SNA=true, SNAPNAME=""; const SNTAB={};
function winViz(x){const ti=Math.min(SNTAB[x.name]||0,x.tabs.length-1);const tab=x.tabs[ti];if(!tab)return"";
  const bar=x.tabs.map((t,i)=>`<span class="${i===ti?"on":""}" data-sn="${e(x.name)}" data-ti="${i}">${e(t.title)}${t.panes>1?" ×"+t.panes:""}</span>`).join("");
  const panes=(tab.detail||[]).map(p=>`<div class="pane ${e(p.agent)}"><span class="d">${e(p.dir)}</span><span class="a ${p.agent}-t">${p.agent?("● "+e(p.agent)+" "+e(p.sid)):'<span class="mut">shell</span>'}</span>${p.title?`<span class="t">${e(p.title)}</span>`:""}</div>`).join("");
  return `<div class="win"><div class="bar">${bar}</div><div class="body ${tab.split==="horizontal"?"h":""}">${panes}</div></div>`}
async function loadSnaps(force){if(cur().s!=="snaps"&&!force)return;try{const d=await (await fetch("/snaps/state")).json();const k=JSON.stringify([d.autosave,d.snaps.map(x=>[x.name,x.mtime])]);if(force||k!==loadSnaps.k){loadSnaps.k=k;SN=d.snaps;SNA=d.autosave;if(cur().s==="snaps")body()}}catch(_){}}
function draw(){if(!D)return;topbar();body();if(cur().s==="snaps"&&!SN)loadSnaps(true)}
async function tick(){try{const d=await (await fetch("/sessions/state")).json();if(V&&d.v!==V){location.reload();return}V=d.v;if(!localPref){skip=d.skip}if(!where)where=d.open_in||"window";
  if(!d.ok){document.getElementById("main").innerHTML='<div class="scr mut">scanning sessions…</div>';return}
  const k=JSON.stringify([d.cwd,d.tty,d.rows.map(r=>[r.tool,r.id,r.title,Math.floor(r.last/60000),r.live]),d.active.map(a=>a.pid+a.status)]);
  if(k!==lastKey){const first=!D;D=d;lastKey=k;if(first||document.activeElement?.id!=="q")draw();else body()}}catch(_){document.getElementById("main").innerHTML='<div class="scr mut">panel is not responding</div>'}}
tick();setInterval(tick,2000);setInterval(()=>loadSnaps(false),5000);
</script></body></html>
